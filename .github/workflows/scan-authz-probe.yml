name: scan-authz-probe
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  security-events: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe scanning endpoints with read-only GITHUB_TOKEN
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os,json,base64,gzip,urllib.request,urllib.error
          tok=os.environ["TOKEN"]; repo=os.environ["REPO"]; sha=os.environ["SHA"]
          base="https://api.github.com/repos/"+repo
          def call(method,path,body=None):
              data=json.dumps(body).encode() if body is not None else None
              req=urllib.request.Request(base+path,data=data,method=method)
              req.add_header("Authorization","Bearer "+tok)
              req.add_header("Accept","application/vnd.github+json")
              req.add_header("X-GitHub-Api-Version","2022-11-28")
              req.add_header("User-Agent","artex-scan")
              if data: req.add_header("Content-Type","application/json")
              try:
                  r=urllib.request.urlopen(req,timeout=30); return r.status,r.read(600).decode(errors="replace")
              except urllib.error.HTTPError as e:
                  return e.code,e.read(600).decode(errors="replace")
          print("WHOAMI",call("GET","/../..")[:1] if False else "skip")
          for m,p,b in [("GET","/code-scanning/alerts",None),
                        ("GET","/code-scanning/alerts/1",None),
                        ("GET","/code-scanning/alerts/1/instances",None),
                        ("GET","/code-scanning/analyses",None),
                        ("GET","/secret-scanning/alerts",None),
                        ("GET","/secret-scanning/alerts/1",None),
                        ("GET","/secret-scanning/alerts/1/locations",None)]:
              s,t=call(m,p); print("PROBE",m,p,s,t[:260].replace("\n"," "))
          sarif={"version":"2.1.0","runs":[{"tool":{"driver":{"name":"artex-gha-probe","rules":[]}},"results":[]}]}
          z=base64.b64encode(gzip.compress(json.dumps(sarif).encode())).decode()
          s,t=call("POST","/code-scanning/sarifs",{"commit_sha":sha,"ref":"refs/heads/main","sarif":z,"tool_name":"artex-gha-probe"})
          print("PROBE POST /code-scanning/sarifs",s,t[:260].replace("\n"," "))
          s,t=call("PATCH","/code-scanning/alerts/1",{"state":"dismissed","dismissed_reason":"won't fix"})
          print("PROBE PATCH /code-scanning/alerts/1",s,t[:260].replace("\n"," "))
          s,t=call("PATCH","/secret-scanning/alerts/1",{"state":"resolved","resolution":"false_positive"})
          print("PROBE PATCH /secret-scanning/alerts/1",s,t[:260].replace("\n"," "))
          s,t=call("GET","/code-scanning/alerts/1")
          print("PROBE GET after",s,t[:260].replace("\n"," "))
          PY
