name: i3687-ghcr-readonly
on:
  push:
    branches: [ main ]
permissions:
  contents: read
  packages: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: ghcr-probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "repo=$GITHUB_REPOSITORY actor=$GITHUB_ACTOR ts=$(date +%s)"
          echo "api-user:$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: token $GH_TOKEN" https://api.github.com/user)"
          for repo in mengcehn/artex-r3472c mengcehn/artex-r3472 artexorgi3562/artex-i3687; do
            echo "== $repo =="
            RESP=$(curl -s -w ' HTTP:%{http_code}' -u "x:$GH_TOKEN" "https://ghcr.io/token?service=ghcr.io&scope=repository:$repo:pull,push")
            echo "token-resp:${RESP: -7}"
            TOK=$(printf '%s' "$RESP" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
            echo "token-len:${#TOK}"
            echo "pull-http:$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOK" -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' "https://ghcr.io/v2/$repo/manifests/w-baseline-3687")"
            echo "post-uploads-http:$(curl -s -o /tmp/up.json -w '%{http_code}' -X POST -H "Authorization: Bearer $TOK" "https://ghcr.io/v2/$repo/blobs/uploads/")"
            head -c 160 /tmp/up.json; echo
            echo "tags-http:$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOK" "https://ghcr.io/v2/$repo/tags/list")"
          done
